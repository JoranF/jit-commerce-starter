name: Analytics – A/B-tests check

on:
  schedule:
    # Dagelijks 06:17 (UTC)
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  # Welke winkels doen mee? (analytics/src/stores.ts, met PostHog-project)
  stores:
    runs-on: ubuntu-latest
    if: ${{ vars.ANALYTICS_ENABLED == 'true' }}
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: analytics/package-lock.json
      - run: npm ci
      - id: list
        run: echo "ids=$(npm run -s stores)" >> "$GITHUB_OUTPUT"

  experiments:
    needs: stores
    if: ${{ needs.stores.outputs.ids != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        store: ${{ fromJson(needs.stores.outputs.ids) }}
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: analytics/package-lock.json
      - run: npm ci
      # Nieuwe experimenten uit config.ts (bv. door de autopilot) als draft aanmaken,
      # zodat de wachtrij ze kan starten. Idempotent: bestaande blijven staan.
      - if: ${{ vars.AUTO_LAUNCH_EXPERIMENTS == 'true' }}
        run: npm run setup -- --store ${{ matrix.store }}
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_APP_HOST: ${{ vars.POSTHOG_APP_HOST || 'https://eu.posthog.com' }}
      - run: npm run experiments -- --store ${{ matrix.store }}
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_APP_HOST: ${{ vars.POSTHOG_APP_HOST || 'https://eu.posthog.com' }}
          REPORT_WEBHOOK_URL: ${{ secrets.REPORT_WEBHOOK_URL }}
          AUTO_SHIP_WINNERS: ${{ vars.AUTO_SHIP_WINNERS || 'false' }}
          AUTO_LAUNCH_EXPERIMENTS: ${{ vars.AUTO_LAUNCH_EXPERIMENTS || 'false' }}
          MAX_CONCURRENT_EXPERIMENTS: ${{ vars.MAX_CONCURRENT_EXPERIMENTS || '1' }}
